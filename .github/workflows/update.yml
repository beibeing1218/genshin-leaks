name: 更新原神內鬼情報站

on:
  schedule:
    - cron: "15 * * * *"     # 每小時一次（GitHub 排程常延遲 5–20 分鐘）
  workflow_dispatch:          # 可在 GitHub 網頁上手動按「Run workflow」
  push:
    branches: [main]
    paths: ["leaks.py", "template.html", ".github/workflows/update.yml"]

permissions:
  contents: write             # 存回消息存檔與翻譯快取
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓消息、翻譯、產生網頁
        run: |
          python leaks.py build
          mkdir -p site
          cp genshin-leaks.html site/index.html

      # 存回 repo：來源一次只給最近幾十則，靠存檔才能累積 7 天；翻譯快取讓下次只翻新標題
      - name: 儲存消息存檔與翻譯快取
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git reset -q origin/main
          git add data/leaks.json data/translations.json
          git diff --cached --quiet || git commit -q -m "更新消息存檔"
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
